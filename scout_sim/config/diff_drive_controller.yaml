#   cmd_vel_timeout: 0.25
#   velocity_rolling_window_size: 0.1

#   # Base frame_id
#   base_frame_id: base_link

#  # Odometry fused with IMU is published by robot_localization, so
#   # no need to publish a TF based on encoders alone.
#   enable_odom_tf: false

#   # Husky hardware provides wheel velocities
#   estimate_velocity_from_position: false

#   # Wheel separation and radius multipliers
#   wheel_separation_multiplier:  1.0 # default: 1.0
#   wheel_radius_multiplier    : 1.0  # default: 1.0

#   # Velocity and acceleration limits
#   # Whenever a min_* is unspecified, default to -max_*
#   linear:
#     x:
#       has_velocity_limits    : true
#       max_velocity           : 2.0   # m/s
#       has_acceleration_limits: true
#       max_acceleration       : 3.0   # m/s^2
#   angular:
#     z:
#       has_velocity_limits    : true
#       max_velocity           : 2.0   # rad/s
#       has_acceleration_limits: true
#       max_acceleration       : 6.0   # rad/s^2

/**/controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

/**/diff_drive_base_controller:
  ros__parameters:
    type: diff_drive_controller/DiffDriveController
    left_wheel_names: ['front_left_wheel_joint', 'rear_left_wheel_joint']
    right_wheel_names: ['front_right_wheel_joint', 'rear_right_wheel_joint']

    # Adjusted for Scout Mini
    wheel_separation: 0.583 # Distance between left and right wheels (meters)
    wheels_per_side: 2  # Two wheels per side, but controlled as one unit
    wheel_radius: 0.165  # Each wheel's radius (meters)

    # Fine-tune these values based on real-world tests
    wheel_separation_multiplier: 1.2  # Slight tuning if turns are inaccurate
    left_wheel_radius_multiplier: 1.0  # Adjust if speeds feel incorrect
    right_wheel_radius_multiplier: -1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.03]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.03]

    open_loop: false
    enable_odom_tf: true

    cmd_vel_timeout: 0.25

    # Realistic velocity & acceleration limits based on Scout Mini's specs
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 2.0  # Max speed ~1.5 m/s
    linear.x.min_velocity: -2.0
    linear.x.max_acceleration: 3.0  # Max acceleration (m/s^2)
    linear.x.max_jerk: .NAN
    linear.x.min_jerk: .NAN

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 2.0  # Max angular velocity (rad/s)
    angular.z.min_velocity: -2.0
    angular.z.max_acceleration: 6.0
    angular.z.min_acceleration: -6.0
    angular.z.max_jerk: .NAN
    angular.z.min_jerk: .NAN

 # Publish all joint states -----------------------------------





